server {
    listen 80;
    server_name _;

    root /var/www/html;
    index index.php index.html;

    client_max_body_size 100M;

    location = / {
        return 301 /Check/;
    }

    # Static files: css/js/images/fonts ห้าม fallback ไป index.php
    location ~* ^/CheckSheetSystem/(.+\.(css|js|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot|map))$ {
        rewrite ^/CheckSheetSystem/(.*)$ /$1 break;
        try_files $uri =404;
        expires 7d;
        access_log off;
    }

    # Main app
    location /CheckSheetSystem/ {
        rewrite ^/CheckSheetSystem/(.*)$ /$1 break;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP
    location ~ ^(?:/CheckSheetSystem)?/(.+\.php)$ {
        include fastcgi_params;

        fastcgi_pass check-sheet-system-php:9000;
        fastcgi_index index.php;

        fastcgi_param SCRIPT_FILENAME $document_root/$1;
        fastcgi_param SCRIPT_NAME /$1;
        fastcgi_param DOCUMENT_ROOT $document_root;

        fastcgi_param HTTPS on;
        fastcgi_param SERVER_PORT 443;
    }
}