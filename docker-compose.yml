services:
  check-sheet-system-nginx:
    image: nginx:latest
    container_name: check-sheet-system-nginx
    restart: unless-stopped
    volumes:
      - ./:/var/www/html
      - ./.docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./.docker/nginx/certs:/etc/nginx/certs
    depends_on:
      - check-sheet-system-php
    networks:
      - check-sheet-system
      - web-gateway
  check-sheet-system-php:
    build:
      context: ./.docker/php
    container_name: check-sheet-system-php
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - ./.docker/php/php.ini:/usr/local/etc/php/php.ini
    networks:
      - check-sheet-system
networks:
  check-sheet-system:
  web-gateway:
    external: true
    name: web-gateway